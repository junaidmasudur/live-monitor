<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Monitor Login</title>

<style>
body{
font-family:Arial;
background:#eef2f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:white;
padding:30px;
width:350px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
}
h2{text-align:center;}
input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}
button{
width:100%;
padding:12px;
margin-top:10px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}
hr{margin:20px 0;}
</style>
</head>

<body>

<div class="box">

<h2>Live Monitor</h2>

<h3>Admin Login</h3>

<input id="aid" placeholder="Admin ID">

<input id="apass" type="password" placeholder="Password">

<button onclick="adminLogin()">Login as Admin</button>

<hr>

<h3>User Login</h3>

<input id="uname" placeholder="Enter your name">

<button onclick="userLogin()">Enter</button>

</div>

<script>

function adminLogin(){

if(aid.value==="ad" && apass.value==="ad"){

location.href="admin.html";

}else{

alert("Wrong admin login.");

}

}

function userLogin(){

const name=uname.value.trim();

if(name===""){

alert("Enter your name.");
return;

}

localStorage.setItem("userName",name);

location.href="user.html";

}

</script>

</body>
</html>
